# Netlify. Security headers come from public/_headers (generated — see deploy/security-headers.ts).
# Set VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and VITE_APP_URL in the site's environment.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: client-side routes are served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
